<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Logic & State Management | To-Do</title>
    <style>
        /* Base Variables & Reset */
        :root {
            --primary: #0056b3;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333;
            --text-muted: #888;
            --border: #ddd;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 3rem 1rem;
        }

        /* App Container */
        .app-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 2rem;
        }

        h1 { margin-bottom: 1.5rem; text-align: center; }

        /* Input Area (Create) */
        .input-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .input-group input {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 1rem;
        }

        .input-group button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Filter Controls */
        .filters {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .filters button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .filters button.active {
            color: var(--primary);
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        /* Task List (Read, Update, Delete) */
        ul { list-style: none; }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: var(--bg-color);
            margin-bottom: 0.5rem;
            border-radius: 4px;
            transition: opacity 0.2s;
        }

        .task-content {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex: 1;
        }

        .task-content input[type="checkbox"] { cursor: pointer; }

        .task-text {
            font-size: 1rem;
            word-break: break-all;
        }

        .completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        /* Action Buttons */
        .actions {
            display: flex;
            gap: 0.5rem;
        }

        .actions button {
            background: none;
            border: 1px solid var(--border);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        
        .actions button.edit-btn:hover { background: #e2e6ea; }
        .actions button.delete-btn { color: #dc3545; border-color: #dc3545; }
        .actions button.delete-btn:hover { background: #dc3545; color: white; }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>Task Manager</h1>
        
        <form class="input-group" id="task-form">
            <input type="text" id="task-input" placeholder="What needs to be done?" required autocomplete="off">
            <button type="submit">Add</button>
        </form>

        <div class="filters" id="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="task-list"></ul>
    </div>

    <script>
        // --- 1. STATE MANAGEMENT ---
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let currentFilter = 'all';

        // DOM Elements
        const taskForm = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const taskList = document.getElementById('task-list');
        const filtersContainer = document.getElementById('filters');

        // --- 2. CORE CRUD FUNCTIONS ---

        // Create
        function addTask(text) {
            const newTask = {
                id: Date.now().toString(),
                text: text,
                completed: false
            };
            tasks.push(newTask);
            saveAndRender();
        }

        // Update (Toggle Status)
        function toggleTask(id) {
            tasks = tasks.map(task => 
                task.id === id ? { ...task, completed: !task.completed } : task
            );
            saveAndRender();
        }

        // Update (Edit Text)
        function updateTaskText(id, newText) {
            tasks = tasks.map(task => 
                task.id === id ? { ...task, text: newText } : task
            );
            saveAndRender();
        }

        // Delete
        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveAndRender();
        }

        // Read & Render
        function renderTasks() {
            // Apply filtering logic
            let filteredTasks = tasks;
            if (currentFilter === 'active') {
                filteredTasks = tasks.filter(t => !t.completed);
            } else if (currentFilter === 'completed') {
                filteredTasks = tasks.filter(t => t.completed);
            }

            // Generate dynamic DOM nodes
            taskList.innerHTML = filteredTasks.map(task => `
                <li class="${task.completed ? 'completed' : ''}" data-id="${task.id}">
                    <div class="task-content">
                        <input type="checkbox" class="toggle-checkbox" ${task.completed ? 'checked' : ''}>
                        <span class="task-text">${task.text}</span>
                    </div>
                    <div class="actions">
                        <button class="edit-btn">Edit</button>
                        <button class="delete-btn">Delete</button>
                    </div>
                </li>
            `).join('');
        }

        // Utility: Save to LocalStorage and refresh UI
        function saveAndRender() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            renderTasks();
        }

        // --- 3. EVENT LISTENERS & DELEGATION ---

        // Form Submit Event (Create)
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = taskInput.value.trim();
            if (text) {
                addTask(text);
                taskInput.value = '';
            }
        });

        // Event Delegation for dynamically created list items
        taskList.addEventListener('click', (e) => {
            const li = e.target.closest('li');
            if (!li) return; // Exit if click wasn't inside a list item
            
            const id = li.dataset.id;

            // Handle Delete
            if (e.target.classList.contains('delete-btn')) {
                deleteTask(id);
            }
            
            // Handle Edit
            if (e.target.classList.contains('edit-btn')) {
                const taskToEdit = tasks.find(t => t.id === id);
                const newText = prompt("Update task:", taskToEdit.text);
                if (newText !== null && newText.trim() !== "") {
                    updateTaskText(id, newText.trim());
                }
            }
        });

        // Event Delegation for dynamically created checkboxes (Change Event)
        taskList.addEventListener('change', (e) => {
            if (e.target.classList.contains('toggle-checkbox')) {
                const li = e.target.closest('li');
                toggleTask(li.dataset.id);
            }
        });

        // Filter Controls Event
        filtersContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                // Update active button styling
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                
                // Update state and render
                currentFilter = e.target.dataset.filter;
                renderTasks();
            }
        });

        // --- 4. INITIALIZATION ---
        // Render stored data immediately on page load
        renderTasks();

    </script>
</body>
</html>
